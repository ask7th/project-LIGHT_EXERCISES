<section class="hero">
  <div class="container hero-container">
    <div class="hero-text">
      <h1 class="hero-title">
        <img
          class="hero-sun"
          src="./images/sun.svg"
          alt=""
          width="59"
          height="59"
        />
        Get <i class="hero-title-accent">Body</i> in shape, Stay healthy
      </h1>
      <p class="hero-subtitle">
        Transform your physique and embrace a healthier lifestyle with our
        comprehensive fitness and nutrition support.
      </p>
    </div>

    <picture class="hero-small">
      <img
        class="hero-small-img"
        src="./images/hero-small.jpg"
        srcset="./images/hero-small.jpg 1x, ./images/hero-small@2x.jpg 2x"
        alt="Two women stretching together outdoors"
        width="168"
        height="100"
        loading="lazy"
      />
    </picture>

    <ul class="hero-tags">
      <li class="hero-tag">#Sport</li>
      <li class="hero-tag">#Healthy</li>
      <li class="hero-tag">#Workout</li>
      <li class="hero-tag">#Diet</li>
    </ul>

    <picture class="hero-picture">
      <source
        media="(min-width: 1440px)"
        srcset="
          ./images/hero-desk.jpg 1x,
          ./images/hero-desk@2x.jpg 2x
        "
      />
      <source
        media="(min-width: 768px)"
        srcset="
          ./images/hero-tab.jpg 1x,
          ./images/hero-tab@2x.jpg 2x
        "
      />
      <source
        srcset="
          ./images/hero-mob.jpg 1x,
          ./images/hero-mob@2x.jpg 2x
        "
      />
      <img
        class="hero-img"
        src="./images/hero-mob.jpg"
        srcset="./images/hero-mob.jpg 1x, ./images/hero-mob@2x.jpg 2x"
        alt="Two women giving each other a high five during a plank workout by the lake"
        width="335"
        height="460"
        fetchpriority="high"
      />
    </picture>
  </div>
</section>
