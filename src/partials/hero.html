<section class="hero">
  <div class="container hero-container">
    <div class="hero-text">
      <h1 class="hero-title">
        <img
          class="hero-sun"
          src="./img/sun.svg"
          alt=""
          width="59"
          height="59"
        />
        Get <i class="hero-title-accent">Body</i> in shape, Stay healthy
      </h1>
      <p class="hero-subtitle">
        Transform your physique and embrace a healthier lifestyle with our
        comprehensive fitness and nutrition support.
      </p>
    </div>

    <picture class="hero-small">
      <source
        srcset="
          ./img/hero-small.webp    1x,
          ./img/hero-small@2x.webp 2x,
          ./img/hero-small@3x.webp 3x
        "
        type="image/webp"
      />
      <img
        class="hero-small-img"
        src="./img/hero-small.jpg"
        srcset="./img/hero-small@2x.jpg 2x, ./img/hero-small@3x.jpg 3x"
        alt="Two women stretching together outdoors"
        width="168"
        height="100"
        loading="lazy"
      />
    </picture>

    <ul class="hero-tags">
      <li class="hero-tag">#Sport</li>
      <li class="hero-tag">#Healthy</li>
      <li class="hero-tag">#Workout</li>
      <li class="hero-tag">#Diet</li>
    </ul>

    <picture class="hero-picture">
      <source
        media="(min-width: 1200px)"
        srcset="
          ./img/hero-desk.webp    1x,
          ./img/hero-desk@2x.webp 2x,
          ./img/hero-desk@3x.webp 3x
        "
        type="image/webp"
      />
      <source
        media="(min-width: 768px)"
        srcset="
          ./img/hero-tab.webp    1x,
          ./img/hero-tab@2x.webp 2x,
          ./img/hero-tab@3x.webp 3x
        "
        type="image/webp"
      />
      <source
        srcset="
          ./img/hero-mob.webp    1x,
          ./img/hero-mob@2x.webp 2x,
          ./img/hero-mob@3x.webp 3x
        "
        type="image/webp"
      />
      <img
        class="hero-img"
        src="./img/hero-mob.jpg"
        srcset="./img/hero-mob@2x.jpg 2x, ./img/hero-mob@3x.jpg 3x"
        alt="Two women giving each other a high five during a plank workout by the lake"
        width="335"
        height="460"
        fetchpriority="high"
      />
    </picture>
  </div>
</section>
