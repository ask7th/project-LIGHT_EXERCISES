<div
  class="exercise-modal"
  data-exercise-modal
  hidden
>
  <div class="exercise-modal-backdrop" data-modal-backdrop></div>
  <div
    class="exercise-modal-dialog"
    data-modal-dialog
    role="dialog"
    aria-modal="true"
    aria-labelledby="exercise-modal-title"
    tabindex="-1"
  >
    <button
      class="exercise-modal-close"
      type="button"
      data-modal-close
      aria-label="Close"
    >
      <svg width="20" height="20" aria-hidden="true">
        <use data-close-icon href=""></use>
      </svg>
    </button>
    <div data-modal-content></div>
  </div>
</div>
