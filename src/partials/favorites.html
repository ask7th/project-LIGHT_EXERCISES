<section
  id="favorites-view"
  class="favorites-page container"
  aria-labelledby="favorites-title"
  hidden
>
  <h1 id="favorites-title" class="favorites-title">Favorites</h1>

  <div class="favorites-layout">
    <aside class="favorites-aside" aria-label="Daily inspiration">
      <section class="quote-panel" aria-labelledby="quote-heading">
        <span class="quote-sport-icon" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 32 32">
            <use href="./images/sprite.svg#icon-quote-run"></use>
          </svg>
        </span>
        <div class="quote-copy">
          <h2 id="quote-heading">Quote of the day</h2>
          <blockquote id="quote-text" class="quote-text"></blockquote>
          <p id="quote-author" class="quote-author">Your Energy</p>
        </div>
        <svg class="quote-mark" width="24" height="24" aria-hidden="true">
          <use href="./images/sprite.svg#icon-quote"></use>
        </svg>
      </section>
      <div class="daily-row">
        <section class="daily-panel" aria-label="Daily norm of sports">
          <span class="daily-icon" aria-hidden="true"
            ><svg width="20" height="20" aria-hidden="true"><use href="./images/sprite.svg#icon-dumbbell"></use></svg></span>
          <p class="daily-number">110 <span>min</span></p>
          <p class="daily-label">Daily norm of sports</p>
        </section>
        <picture class="daily-picture">
          <source
            media="(max-width: 767px)"
            srcset="./images/favorites-sport-mobile.jpg 1x, ./images/favorites-sport-mobile@2x.jpg 2x"
            type="image/jpeg"
          />
          <source
            media="(max-width: 1199px)"
            srcset="./images/favorites-sport-tablet.jpg 1x, ./images/favorites-sport-tablet@2x.jpg 2x"
            type="image/jpeg"
          />
          <img
            src="./images/favorites-sport-desktop.jpg"
            srcset="./images/favorites-sport-desktop@2x.jpg 2x"
            width="344"
            height="141"
            alt="Two women smiling during a workout outdoors"
            loading="lazy"
          />
        </picture>
      </div>
    </aside>

    <section class="favorites-content" aria-labelledby="exercise-heading">
      <h2 id="exercise-heading" class="favorites-sr-only">
        Favorite exercises
      </h2>
      <p id="favorites-count" class="favorites-sr-only" aria-live="polite">
        0 exercises
      </p>
      <div
        id="favorites-message"
        class="favorites-message favorites-sr-only"
        role="status"
        hidden
      ></div>
      <div id="favorites-list" class="exercise-grid" aria-live="polite"></div>
      <div id="favorites-empty" class="empty-state" hidden>
        <p>
          It appears that you haven't added any exercises to your favorites yet.
          To get started, you can add exercises that you like to your favorites
          for easier access in the future.
        </p>
      </div>
    </section>
  </div>
</section>
