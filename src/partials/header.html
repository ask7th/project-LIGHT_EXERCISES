<header class="header">
  <div class="container header-container">
    <a class="header-logo" href="./index.html" aria-label="Your Energy home">
      <svg width="132" height="24" aria-hidden="true">
        <use href="./images/sprite.svg#icon-logo"></use>
      </svg>
    </a>

    <button
      class="header-menu-toggle"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="header-menu"
    >
      <svg class="header-menu-icon header-menu-icon-open" aria-hidden="true">
        <use href="./images/sprite.svg#icon-menu"></use>
      </svg>
      <svg class="header-menu-icon header-menu-icon-close" aria-hidden="true">
        <use href="./images/sprite.svg#icon-close"></use>
      </svg>
    </button>

    <div class="header-menu" id="header-menu">
      <nav class="header-navigation" aria-label="Main navigation">
        <ul class="header-navigation-list">
          <li class="header-navigation-item">
            <a class="header-navigation-link" href="./index.html">Home</a>
          </li>
          <li class="header-navigation-item">
            <a class="header-navigation-link" href="./favorites.html"
              >Favorites</a
            >
          </li>
        </ul>
      </nav>

      <ul class="header-social-list" aria-label="Social media">
        <li class="header-social-item">
          <a
            class="header-social-link"
            href="https://www.facebook.com/goITclub/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GoIT on Facebook"
          >
            <svg width="8" height="20" aria-hidden="true">
              <use href="./images/sprite.svg#icon-facebook"></use>
            </svg>
          </a>
        </li>
        <li class="header-social-item">
          <a
            class="header-social-link"
            href="https://www.instagram.com/goitclub/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GoIT on Instagram"
          >
            <svg width="23" height="23" aria-hidden="true">
              <use href="./images/sprite.svg#icon-instagram"></use>
            </svg>
          </a>
        </li>
        <li class="header-social-item">
          <a
            class="header-social-link"
            href="https://www.youtube.com/c/GoIT"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GoIT on YouTube"
          >
            <svg width="25" height="18" aria-hidden="true">
              <use href="./images/sprite.svg#icon-youtube"></use>
            </svg>
          </a>
        </li>
      </ul>
    </div>
  </div>
