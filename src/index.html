<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Energy</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz@9..40&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <load src="./partials/header.html" />
    <main>
      <!-- Loads the specified .html file -->

      <!-- Панель фільтрів (кнопки) -->
      <div class="filters-container">
        <button class="filter-btn active" data-filter="Muscles">Muscles</button>
        <button class="filter-btn" data-filter="Body parts">Body parts</button>
        <button class="filter-btn" data-filter="Equipment">Equipment</button>
      </div>

      <!-- Контейнер для списку категорій -->
      <ul class="categories-list js-categories-list">
      </ul>
      
      <section class="quote-section">
        <!-- Блок цитати -->
        <div class="quote-container">
          <h2 class="quote-title">Quote of the day</h2>
          <p class="quote-text js-quote-text">Loading...</p>
          <p class="quote-author js-quote-author"></p>
        </div>
        
        <!-- Статичний інформаційний блок про спорт -->
        <div class="exercise-info-card">
          <p class="info-title">110 min</p>
          <p class="info-subtitle">Daily norm of sports</p>
        </div>
      </section>

    </main>
    <load src="./partials/footer.html" />

    <script type="module" src="./main.js"></script>
  </body>
</html>
